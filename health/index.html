<!doctype html>
<html lang="en-ZA">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Dr Pocket</title>
<meta name="description" content="Your personal health record and symptom journal: notes, pain, exercise, files and a doctor summary.">
<meta name="theme-color" content="#FFFFFF">
<!-- Installable: "Add to Home Screen" opens Dr Pocket full screen with its own icon, like Remus. -->
<link rel="manifest" href="/manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Dr Pocket">
<link rel="icon" type="image/svg+xml" href="/brand/dr-pocket-symbol.svg">
<link rel="apple-touch-icon" href="/icons/icon-180.png">
<!-- Montserrat is served from Dr Pocket itself (public/fonts), never from Google: a stylesheet from another
     server can hold the whole page blank on a weak signal. -->
<link rel="preload" href="/fonts/montserrat-latin.woff2" as="font" type="font/woff2" crossorigin>
<script>
  // Settings → Appearance, before first paint (src/health/appearance.js; keep the key in step).
  (function () {
    var m = 'light';
    try { var v = localStorage.getItem('drpocket.appearance'); if (/^(light|dark|contrast|system)$/.test(v)) m = v; } catch (e) {}
    if (m === 'system') m = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    document.documentElement.setAttribute('data-appearance', m);
    if (m === 'dark') document.querySelector('meta[name="theme-color"]').setAttribute('content', '#071A2E');
  })();
</script>
</head>
<body>
<div id="app"><p id="boot" style="font:500 15px/1.5 system-ui,-apple-system,sans-serif;color:#5A6B7D;text-align:center;padding:40vh 24px 0;margin:0">Opening Dr Pocket…</p></div>
<script>
  // Never a blank page: if the app has not started after 10 seconds, say so and offer a way out.
  (function () {
    var err = '';
    addEventListener('error', function (e) { err = err || (e && (e.message || (e.target && e.target.src) || 'a file could not load')); }, true);
    setTimeout(function () {
      if (window.__drpStarted) return;
      var b = document.getElementById('app');
      b.innerHTML = '<div style="font:15px/1.5 system-ui,-apple-system,sans-serif;color:#0B2342;max-width:420px;margin:0 auto;padding:30vh 24px 0;text-align:center">'
        + '<h1 style="font-size:22px;margin:0 0 8px">Dr Pocket is taking long to open</h1>'
        + '<p style="color:#5A6B7D;margin:0 0 18px">The signal may be too weak. You can open it without signal: what you save stays on this phone and uploads later.</p>'
        + '<p><button id="bo" style="font:600 16px system-ui;padding:12px 18px;border:0;border-radius:12px;background:#006F7F;color:#fff">Open without signal</button></p>'
        + '<p><button id="br" style="font:600 15px system-ui;padding:10px 16px;border:1px solid #C9D3DA;border-radius:12px;background:#fff;color:#0B2342">Try again</button></p>'
        + (err ? '<p style="color:#8193A3;font-size:12px;margin-top:18px">Details: ' + String(err).replace(/[<>&]/g, '').slice(0, 140) + '</p>' : '') + '</div>';
      document.getElementById('bo').onclick = function () { try { localStorage.setItem('drpocket.forceOffline', String(Date.now())); } catch (e) {} location.reload(); };
      document.getElementById('br').onclick = function () { location.reload(); };
    }, 10000);
  })();
</script>
<script type="module" src="/src/health/app.js"></script>
</body>
</html>
